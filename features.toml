[[route]]
id = "route/run-tensor-on-compute-site"
task = "Run tensor on a compute site"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-compute/tensor-providers", why = "The compute-provider row owns modeled resident, automatic, probe-backed wgpu, optional CUDA, and optional ROCm site placement." },
  { specimen = "recipe/sim-compute/crates/sim-lib-compute-model/01-basics/modeled-resident-matrix", why = "The modeled-resident recipe shows chained resident tensors with one materialization." },
  { specimen = "recipe/sim-compute/crates/sim-lib-compute-auto/01-basics/measured-profile-routing", why = "The auto recipe shows measured Table-backed profile routing, conservative CPU fallback, and ledger evidence." },
  { specimen = "recipe/sim-compute/crates/sim-lib-compute-cuda/01-basics/cuda-discovery", why = "The CUDA recipe shows runtime ABI validation and optional site export without a toolkit dependency." },
  { specimen = "recipe/sim-compute/crates/sim-lib-compute-rocm/01-basics/rocm-discovery", why = "The ROCm recipe shows HIP/rocBLAS ABI validation, observed gfx target evidence, and optional site export without a toolkit dependency." },
]
