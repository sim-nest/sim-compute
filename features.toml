[[feature]]
id = "feature/sim-compute/tensor-providers"
title = "Tensor compute providers"
summary = "Run canonical Tensor requests through modeled, automatic, probe-backed wgpu, optional CUDA/cuBLAS, and optional ROCm/rocBLAS compute sites."
owner = "crate/sim-lib-compute-model"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a tensor expression needs a loadable provider site. The modeled executor preserves canonical Tensor identity while returning segmented resident storage, bounded queue byte/node/deadline evidence, eviction counters, cached materialization, and injected OOM, device-loss, eviction, or readback faults. The auto site records measured adapter/driver/backend profiles with limits, transfer, allocation, tiles, sample distributions, thermal/power context, and provenance; persists them only through caller-supplied Table/Dir values with bounded keys and bytes; chooses CPU for absent, stale, incompatible, or inconclusive evidence; and ledgers provider choices, materialization bytes, and synchronizations. The wgpu provider enumerates adapters deterministically, records requested and granted hardware limits/features plus transfer, mapping, and bounded-allocation evidence, executes portable f32 element-wise arithmetic, sqrt/exp/sin/cos, fixed-tree sum/min/max/norm reductions, transpose, dot, and tiled matmul over bounded resident segments, uses native f16 only when granted, widens bf16 or unsupported half work to f32, caches validated pipelines by adapter/op/dtype/rank/tile profile, and exports only successful hardware sites. The CUDA provider has no toolkit or link-time dependency: it dynamically loads versioned driver, cuBLAS, and cuBLASLt symbols, exports a site only after ABI validation, accepts dense f32 matmul plus cuBLASLt-supported half-family matmul, and declines every other operation before accepting a submission. The ROCm provider has no toolkit or link-time dependency: on Linux it dynamically loads compatible HIP and rocBLAS symbols, requires observed AMD gfx target evidence before exporting a site, accepts dense f32 matmul plus rocBLASLt-supported half-family matmul, and declines every other operation before accepting a submission."
claims_anchors = [
  "anchor/crate/sim-lib-compute-auto",
  "anchor/crate/sim-lib-compute-cuda",
  "anchor/crate/sim-lib-compute-model",
  "anchor/crate/sim-lib-compute-rocm",
  "anchor/crate/sim-lib-compute-wgpu",
  "anchor/export/sim-lib-compute-auto/site/compute/auto",
  "anchor/export/sim-lib-compute-cuda/site/compute/cuda",
  "anchor/export/sim-lib-compute-model/site/compute/model",
  "anchor/export/sim-lib-compute-rocm/site/compute/rocm",
  "anchor/runtime-lib/sim-lib-compute-auto/compute-auto-lib",
  "anchor/runtime-lib/sim-lib-compute-cuda/compute-cuda-lib",
  "anchor/runtime-lib/sim-lib-compute-model/compute-model-lib",
  "anchor/runtime-lib/sim-lib-compute-rocm/compute-rocm-lib",
  "anchor/runtime-lib/sim-lib-compute-wgpu/compute-wgpu-lib",
  "anchor/rustdoc/sim-lib-compute-auto/auto-tensor-executor",
  "anchor/rustdoc/sim-lib-compute-cuda/cuda-runtime-loader",
  "anchor/rustdoc/sim-lib-compute-cuda/cuda-tensor-executor",
