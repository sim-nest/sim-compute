[[feature]]
id = "feature/sim-compute/tensor-providers"
title = "Tensor compute providers"
summary = "Run canonical Tensor requests through modeled, automatic, probe-backed wgpu, optional CUDA/cuBLAS, and optional ROCm/rocBLAS compute sites."
owner = "crate/sim-lib-compute-model"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a tensor expression needs a loadable provider site. The modeled executor preserves canonical Tensor identity while returning segmented modeled-resident storage, bounded queue byte/node/deadline evidence, bounded auto-flush batch evidence, eviction counters, cached materialization, and injected OOM, device-loss, eviction, or readback faults. Its resident ODE adapter composes the published tensor ODE pipeline through the modeled tensor site, batches fixed RK stages without stage readback, keeps adaptive candidates modeled-resident, and declines scalar, small, or nonlowerable RHS work before execution. The auto site records bounded synthetic adapter/driver/backend profiles with limits, transfer, allocation, tiles, sample distributions, thermal/power context, provenance, evidence kind, and observed identity; persists them only through caller-supplied Table/Dir values with bounded keys and bytes; chooses CPU for absent, stale, incompatible, inconclusive, modeled, host-emulated, or caller-renamed evidence; and ledgers provider choices, materialization bytes, and synchronizations. The wgpu provider enumerates adapters deterministically, records requested and granted limits/features plus transfer, mapping, bounded-allocation, and observed identity evidence, retains the selected Device and Queue for exported physical sites, dispatches f32 add/subtract/multiply/divide/negation/sqrt/exp/log/sin/cos, fixed-tree sum/min/max/norm reductions, transpose, dot, matrix-vector, vector-matrix, and tiled matmul through real compute passes, rejects unsupported dtype/shape/limit combinations before submission, keeps device-loss/readback errors explicit, uses native f16 labels only when granted, widens bf16 or unsupported half work to f32, and caches validated and compiled pipeline records by adapter/op/dtype/rank/tile profile. Synthetic wgpu fixtures remain host-emulated and cannot satisfy physical-device acceptance. The CUDA provider has no toolkit or link-time dependency: it dynamically loads versioned driver, runtime, cuBLAS, and cuBLASLt symbols, exports a site only while validated live handles are retained, executes dense f32 matmul through cuBLAS into device-resident storage, and declines every other operation or half-family dtype before accepting a submission. The ROCm provider has no toolkit or link-time dependency: on Linux it dynamically loads compatible HIP and rocBLAS symbols, requires observed AMD gfx target evidence before exporting a site, executes dense f32 matmul through rocBLAS into device-resident storage, and declines every other operation or half-family dtype before accepting a submission. Sanitized vendor-v1 artifacts record per-target differential and three-sample crossover observations for both NVIDIA targets and the AMD gfx1151 target, plus explicit absent-runtime refusal, automatic CPU/Absent explanation, and retained wgpu probe evidence; these bounded samples are not universal speed claims. The FEMM compute solver routes CSR/work-vector storage and Krylov math through the selected provider, then uses CPU f64 residual certification for acceptance."
claims_anchors = [
  "anchor/crate/sim-lib-compute-auto",
  "anchor/crate/sim-lib-compute-cuda",
  "anchor/crate/sim-lib-compute-model",
  "anchor/crate/sim-lib-compute-rocm",
