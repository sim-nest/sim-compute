[[feature]]
id = "feature/sim-compute/compute-cli"
title = "Compute command library"
summary = "Export a bounded loadable `cli/main/compute` command for inspecting compute devices, probes, profiles, explanations, recipes, and physical acceptance artifacts."
owner = "crate/sim-lib-compute-cli"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a host needs a command surface for compute providers without adding a binary or bootstrap fork. The library exports `cli/main/compute` as a loadable function, accepts only checked selectors and bounded ceilings, requires `compute.device`, `compute.profile.read`, `compute.profile.write`, and `compute.acceptance` capabilities for privileged views, renders stable text or JSON machine evidence, reports modeled no-adapter and hardware no-adapter states, persists bounded synthetic profiles only through a caller-supplied Table/Dir value, and captures or verifies sanitized `sim.compute-acceptance/v1` portable artifacts and `sim.compute-vendor-acceptance/v1` vendor artifacts. Capture requires one registered target capability and binds RTX 5080 Laptop, RTX 5090, or AMD gfx1151 evidence to a matching physical adapter. The committed portable-v1 set records verifier-clean wgpu captures for all three targets against source 504255b534e69a37d7163ba06048bc23ebdb7cb4, including zero-intermediate-readback matrix, transcendental, ODE, cross-binding segmentation, and certified FEMM cases. The committed vendor-v1 set records runtime probe, dense f32 matmul differential, invalid-shape refusal, three-sample crossover, explicit absent-runtime refusal, automatic CPU/Absent explanation, and retained wgpu probe evidence for the same targets against source 12cb08ae6572946d5c11d06635ad079eecf8533c. Synthetic, host-emulated, caller-renamed, cross-target, wrong-source, duplicate, private, stale-schema, impossible-counter, and internally inconsistent crossover artifacts fail verification and cannot satisfy physical-device acceptance."
claims_anchors = [
  "anchor/cli/compute",
  "anchor/crate/sim-lib-compute-cli",
  "anchor/export/sim-lib-compute-cli/cli/main/compute",
  "anchor/export/sim-lib-compute-cli/model/no-adapter",
  "anchor/runtime-lib/sim-lib-compute-cli/compute-cli-lib",
  "anchor/rustdoc/sim-lib-compute-cli/compute-cli-lib",
  "anchor/rustdoc/sim-lib-compute-cli/compute-command",
  "anchor/rustdoc/sim-lib-compute-cli/parse_compute_args",
  "anchor/rustdoc/sim-lib-compute-cli/run_command",
]
claims_surfaces = [
  "cli/compute",
]
claims_specimens = [
  "recipe/sim-compute/crates/sim-lib-compute-cli/01-basics/inspect-compute-device",
]

[[route]]
id = "route/inspect-compute-device"
task = "Inspect a compute device"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-compute/compute-cli", why = "The compute CLI row owns devices, probe, profile, explain, and recipe command behavior." },
