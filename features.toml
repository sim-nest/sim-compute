  { specimen = "recipe/sim-compute/crates/sim-lib-compute-cli/01-basics/inspect-compute-device", why = "The recipe shows the loadable command inspecting installed sites and Table-backed profile storage." },
]

[[feature]]
id = "feature/sim-compute/femm-resident-solvers"
title = "Resident FEMM sparse solvers"
summary = "Export a provider-neutral FEMM LinearSolver that keeps CSR and Krylov work vectors resident while requiring f64 residual certification."
owner = "crate/sim-lib-compute-femm"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a FEMM steady solve should run through a compute provider without weakening solver acceptance. The resident solver uploads validated CSR matrices once, reuses factors by the published FEMM fingerprint, keeps f32 CG or BiCGSTAB work vectors resident, routes sparse matvec, dot, norm, and vector updates through the selected provider, synchronizes convergence as scalar residual evidence at a documented cadence, recomputes the accepted residual on CPU in f64, applies bounded f64 iterative correction, and refuses provider loss, nonconvergence, Krylov breakdown, stale factor payloads, transpose requests, non-finite data, and certification failure. The loadable library exports the existing femm/linear-solver value, so sim-lib-femm-solve remains responsible for the SolveCertificate."
claims_anchors = [
  "anchor/crate/sim-lib-compute-femm",
  "anchor/runtime-lib/sim-lib-compute-femm/compute-femm-lib",
  "anchor/rustdoc/sim-lib-compute-femm/resident-csr-solver",
]
claims_specimens = [
  "recipe/sim-compute/crates/sim-lib-compute-femm/01-basics/resident-csr-solve",
  "spec-test/sim-compute/crates/sim-lib-compute-femm/src/lib",
]

