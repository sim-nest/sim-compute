[[feature]]
id = "feature/sim-compute/compute-cli"
title = "Compute command library"
summary = "Export a bounded loadable `cli/main/compute` command for inspecting compute devices, probes, profiles, explanations, and recipes."
owner = "crate/sim-lib-compute-cli"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a host needs a command surface for compute providers without adding a binary or bootstrap fork. The library exports `cli/main/compute` as a loadable function, accepts only checked selectors and bounded ceilings, requires `compute.device`, `compute.profile.read`, and `compute.profile.write` capabilities for privileged views, renders stable text or JSON machine evidence, reports modeled no-adapter and hardware no-adapter states, and persists bounded synthetic profiles only through a caller-supplied Table/Dir value. Synthetic or caller-renamed profiles report `non-physical` and cannot satisfy physical-device acceptance."
claims_anchors = [
  "anchor/cli/compute",
  "anchor/crate/sim-lib-compute-cli",
  "anchor/export/sim-lib-compute-cli/cli/main/compute",
  "anchor/export/sim-lib-compute-cli/model/no-adapter",
  "anchor/runtime-lib/sim-lib-compute-cli/compute-cli-lib",
  "anchor/rustdoc/sim-lib-compute-cli/compute-cli-lib",
  "anchor/rustdoc/sim-lib-compute-cli/compute-command",
  "anchor/rustdoc/sim-lib-compute-cli/parse_compute_args",
  "anchor/rustdoc/sim-lib-compute-cli/run_command",
]
claims_surfaces = [
  "cli/compute",
]
claims_specimens = [
  "recipe/sim-compute/crates/sim-lib-compute-cli/01-basics/inspect-compute-device",
]

[[route]]
id = "route/inspect-compute-device"
task = "Inspect a compute device"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-compute/compute-cli", why = "The compute CLI row owns devices, probe, profile, explain, and recipe command behavior." },
  { feature = "feature/sim-compute/tensor-providers", why = "Provider rows supply the modeled, automatic, retained-device wgpu, and optional hardware site symbols the command inspects." },
  { specimen = "recipe/sim-compute/crates/sim-lib-compute-cli/01-basics/inspect-compute-device", why = "The recipe shows the loadable command inspecting installed sites and Table-backed profile storage." },
]

[[feature]]
id = "feature/sim-compute/femm-resident-solvers"
title = "Resident FEMM sparse solvers"
summary = "Export a provider-neutral FEMM LinearSolver that keeps CSR and Krylov work vectors resident while requiring f64 residual certification."
owner = "crate/sim-lib-compute-femm"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a FEMM steady solve should run through a compute provider without weakening solver acceptance. The resident solver uploads validated CSR matrices once, reuses factors by the published FEMM fingerprint, keeps f32 CG or BiCGSTAB work vectors resident, synchronizes convergence as scalar residual evidence at a documented cadence, recomputes the accepted residual on CPU in f64, applies bounded f64 iterative correction, and refuses nonconvergence, Krylov breakdown, stale factor payloads, transpose requests, non-finite data, and certification failure. The loadable library exports the existing femm/linear-solver value, so sim-lib-femm-solve remains responsible for the SolveCertificate."
claims_anchors = [
  "anchor/crate/sim-lib-compute-femm",
  "anchor/runtime-lib/sim-lib-compute-femm/compute-femm-lib",
  "anchor/rustdoc/sim-lib-compute-femm/resident-csr-solver",
]
claims_specimens = [
  "recipe/sim-compute/crates/sim-lib-compute-femm/01-basics/resident-csr-solve",
  "spec-test/sim-compute/crates/sim-lib-compute-femm/src/lib",
]

[[route]]
id = "route/add-resident-femm-csr-solver"
task = "Add a resident FEMM CSR solver"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-compute/femm-resident-solvers", why = "The compute FEMM row owns resident CSR upload, Krylov execution, f64 refinement, and loadable solver export." },
