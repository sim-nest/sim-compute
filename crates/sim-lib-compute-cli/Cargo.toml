[package]
name = "sim-lib-compute-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Loadable compute command surface for SIM."
readme = "README.md"
publish = true

[dependencies]
sim-cookbook = { version = "0.1.3" }
sim-kernel = { version = "0.1.4" }
sim-lib-compute-auto = { version = "0.1.0", path = "../sim-lib-compute-auto" }
sim-lib-compute-model = { version = "0.1.0", path = "../sim-lib-compute-model" }

[build-dependencies]
sim-cookbook = { version = "0.1.3" }

[dev-dependencies]
sim-kernel = { version = "0.1.4", features = ["test-support"] }

[lints]
workspace = true
