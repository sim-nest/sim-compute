[package]
name = "sim-lib-compute-model"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Modeled resident tensor compute site for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-compute"
homepage = "https://github.com/sim-nest/sim-compute"

[dependencies]
sim-cookbook = { version = "0.1.3" }
sim-kernel = { version = "0.1.4" }
sim-lib-numbers-tensor = { version = "0.1.5" }
sim-table-core = { version = "0.1.2" }

[build-dependencies]
sim-cookbook = { version = "0.1.3" }

[dev-dependencies]
sim-kernel = { version = "0.1.4", features = ["test-support"] }
sim-lib-numbers-arith = { version = "0.2.0" }
sim-lib-numbers-f64 = { version = "0.2.0" }
sim-lib-numbers-float = { version = "0.2.0" }
sim-lib-numbers-func = { version = "0.2.0" }
sim-lib-numbers-i64 = { version = "0.2.0" }
sim-lib-numbers-numeric = { version = "0.2.0" }
sim-lib-numbers-rk = { version = "0.2.0" }
sim-lib-numbers-tensor-bcast = { version = "0.2.0" }

[lints]
workspace = true
