[package]
name = "sim-lib-compute-rocm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime-loaded ROCm/rocBLAS tensor compute site for SIM."
readme = "README.md"
publish = false

[dependencies]
libloading = "0.8"
sim-cookbook = { version = "0.1.3" }
sim-kernel = { version = "0.1.4" }
sim-lib-numbers-tensor = { version = "0.1.5" }

[build-dependencies]
sim-cookbook = { version = "0.1.3" }

[dev-dependencies]
sim-kernel = { version = "0.1.4", features = ["test-support"] }
sim-lib-numbers-arith = { version = "0.1.0" }
sim-lib-numbers-f64 = { version = "0.1.0" }
sim-lib-numbers-float = { version = "0.1.0" }

[lints.rust]
unsafe_code = "allow"
