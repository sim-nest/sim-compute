[package]
name = "sim-lib-compute-auto"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Automatic tensor compute site selection for SIM."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-compute"
homepage = "https://github.com/sim-nest/sim-compute"

[dependencies]
sim-citizen = { version = "0.1.2" }
sim-cookbook = { version = "0.1.3" }
sim-kernel = { version = "0.1.4" }
sim-lib-compute-model = { version = "0.1.0", path = "../sim-lib-compute-model" }
sim-lib-numbers-tensor = { version = "0.1.5" }

[build-dependencies]
sim-cookbook = { version = "0.1.3" }

[dev-dependencies]
sim-kernel = { version = "0.1.4", features = ["test-support"] }
sim-lib-numbers-arith = { version = "0.1.0" }
sim-lib-numbers-f64 = { version = "0.1.0" }
sim-lib-numbers-float = { version = "0.1.0" }
sim-lib-numbers-i64 = { version = "0.1.0" }

[lints]
workspace = true
