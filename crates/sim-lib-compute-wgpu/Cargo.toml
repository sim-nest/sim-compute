[package]
name = "sim-lib-compute-wgpu"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Evidence-based wgpu tensor compute site discovery for SIM."
readme = "README.md"
publish = true

[dependencies]
half = "2"
pollster = "0.4"
sim-cookbook = { version = "0.1.3" }
sim-kernel = { version = "0.1.4" }
sim-lib-compute-auto = { version = "0.3.0", path = "../sim-lib-compute-auto" }
sim-lib-numbers-tensor = { version = "0.2.0" }
wgpu = "30.0.0"

[build-dependencies]
sim-cookbook = { version = "0.1.3" }

[dev-dependencies]
sim-kernel = { version = "0.1.4", features = ["test-support"] }
sim-lib-numbers-arith = { version = "0.3.0" }
sim-lib-numbers-f64 = { version = "0.3.0" }
sim-lib-numbers-float = { version = "0.3.0" }

[lints]
workspace = true
