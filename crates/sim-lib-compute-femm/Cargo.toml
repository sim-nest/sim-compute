[package]
name = "sim-lib-compute-femm"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Provider-neutral resident CSR FEMM linear solver for SIM."
readme = "README.md"
publish = true

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-compute-model = { version = "0.3.0", path = "../sim-lib-compute-model" }
sim-lib-femm-core = { version = "0.3.0" }
sim-lib-femm-solve = { version = "0.3.0" }
sim-lib-numbers-arith = { version = "0.3.1" }
sim-lib-numbers-f64 = { version = "0.3.1" }
sim-lib-numbers-float = { version = "0.3.1" }
sim-lib-numbers-tensor = { version = "0.2.1" }

[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[dev-dependencies]
sim-kernel = { version = "0.2.0", features = ["test-support"] }

[lints]
workspace = true
