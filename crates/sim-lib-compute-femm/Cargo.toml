[package]
name = "sim-lib-compute-femm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Provider-neutral resident CSR FEMM linear solver for SIM."
readme = "README.md"
publish = true

[dependencies]
sim-cookbook = { version = "0.1.3" }
sim-kernel = { version = "0.1.4" }
sim-lib-femm-core = { version = "0.2.0" }
sim-lib-femm-solve = { version = "0.2.0" }

[build-dependencies]
sim-cookbook = { version = "0.1.3" }

[dev-dependencies]
sim-kernel = { version = "0.1.4", features = ["test-support"] }

[lints]
workspace = true
